appId: com.wiredrop.desktop
productName: WireDrop
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - dist-electron/**
  - package.json
  - main.js
extraResources:
  - from: backend-dist
    to: backend
    filter:
      - "**/*"
win:
  target:
    - nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WireDrop
